<script>
const PASSWORD = "yasooo";
let musicStarted = false;

// دالة التنقل بين الشاشات
function showScreen(id) {
  const screens = document.querySelectorAll(".screen");
  screens.forEach(screen => screen.classList.remove("active"));

  const nextScreen = document.getElementById(id);
  if (nextScreen) {
    nextScreen.classList.add("active");
  }
}

// دالة تسجيل الدخول (كانت هذه هي الناقصة)
function login() {
  const input = document.getElementById("passwordInput");
  const errorMsg = document.getElementById("error");

  // التحقق من كلمة المرور (مع إزالة المسافات الزائدة وتحويلها لأحرف صغيرة لتسهيل الدخول)
  if (input.value.trim().toLowerCase() === PASSWORD) {
    errorMsg.style.display = "none";
    input.value = ""; // تفريغ الحقل
    
    // الانتقال للشاشة التالية
    showScreen("dateScreen");
    
    // محاولة تشغيل الموسيقى
    startMusic();
  } else {
    // إظهار رسالة الخطأ إذا كانت كلمة المرور خاطئة
    errorMsg.style.display = "block";
    input.value = "";
    input.focus(); // إعادة المؤشر للحقل للكتابة مجدداً
  }
}

// إضافة ميزة الضغط على زر Enter في الكيبورد للدخول
document.getElementById("passwordInput").addEventListener("keypress", function(event) {
  if (event.key === "Enter") {
    event.preventDefault(); // منع أي سلوك افتراضي
    login();
  }
});

// دالة تشغيل الموسيقى (مكتملة)
function startMusic() {
  const player = document.getElementById("musicPlayer");
  const song = document.getElementById("siteSong");

  if (player) player.classList.add("visible");

  if (!musicStarted && song) {
    musicStarted = true;
    const playAttempt = song.play();
    
    // التعامل مع حالة منع المتصفح للتشغيل التلقائي
    if (playAttempt && typeof playAttempt.catch === "function") {
      playAttempt.catch(() => {
        console.log("Autoplay blocked by browser. User can play manually.");
        // المتصفح قد يمنع التشغيل التلقائي للصوت، وسيظهر مشغل الصوت للمستخدم ليضغط Play يدوياً
      });
    }
  }
}

// التركيز التلقائي على حقل كلمة المرور عند فتح الصفحة
window.onload = function() {
  document.getElementById("passwordInput").focus();
};
</script>
